<!DOCTYPE html>
<html lang="en">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AMS Business Hub</title>
  <style>
    :root{--green:#123d32;--green2:#1d5b49;--ivory:#f7f5ed;--ink:#17231f;--muted:#68766f;--line:#e4e8e1}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:var(--ivory);color:var(--ink);font:16px/1.5 Inter,system-ui,sans-serif}
    main{width:min(100%,620px);padding:clamp(28px,6vw,52px);border:1px solid var(--line);border-radius:24px;background:#fff;box-shadow:0 24px 70px #123d3214}
    .mark{display:grid;place-items:center;width:48px;height:48px;border-radius:15px;color:white;background:var(--green);font-weight:800}
    .eyebrow{margin:26px 0 8px;color:var(--green2);font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase}
    h1{margin:0;color:var(--green);font-size:clamp(32px,6vw,48px);line-height:1.05;letter-spacing:-.045em}
    p{color:var(--muted)}.status{display:flex;align-items:center;gap:10px;margin-top:28px;padding:14px 16px;border:1px solid var(--line);border-radius:14px;background:#fbfcfa;font-size:14px}
    .dot{width:9px;height:9px;border-radius:50%;background:#c58a2b}#statusText{color:var(--muted)}footer{margin-top:30px;color:#8a958e;font-size:12px}
  </style>
</head>
<body>
  <main>
    <div class="mark">AMS</div>
    <div class="eyebrow">AMS Enterprises and Services</div>
    <h1>Business Hub</h1>
    <p>The new central workspace is being established. This is the independent Milestone 001 foundation.</p>
    <div class="status" role="status" aria-live="polite"><span class="dot" id="statusDot"></span><span id="statusText">Checking application connection…</span></div>
    <footer>AMS Business Hub · Foundation build 001</footer>
  </main>
  <script>
    google.script.run
      .withSuccessHandler(function(r){
        document.getElementById('statusDot').style.background='#23845b';
        document.getElementById('statusText').textContent=r&&r.success?'Application connection is working.':'Application responded, but health check was incomplete.';
      })
      .withFailureHandler(function(){
        document.getElementById('statusDot').style.background='#b84b42';
        document.getElementById('statusText').textContent='Could not contact the backend. Check the Apps Script deployment.';
      })
      .getHubHealth();
  </script>
</body>
</html>
